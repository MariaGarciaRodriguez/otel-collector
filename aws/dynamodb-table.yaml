AWSTemplateFormatVersion: "2010-09-09"
Description: Dynamic per-agent allow-list for exporting traces from the central OTel Collector to Arize.
Parameters:
  TableName:
    Type: String
    Default: otel-arize-enabled-agents
Resources:
  ArizeEnabledAgentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: agent_id
          AttributeType: S
      KeySchema:
        - AttributeName: agent_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
Outputs:
  TableName:
    Value: !Ref ArizeEnabledAgentsTable
  TableArn:
    Value: !GetAtt ArizeEnabledAgentsTable.Arn
