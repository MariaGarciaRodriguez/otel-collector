AWSTemplateFormatVersion: "2010-09-09"
Description: Hot backend policy for the central OpenTelemetry Collector.
Parameters:
  TableName:
    Type: String
    Default: otel-observability-backend-policy
Resources:
  BackendPolicyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: policy_key
          AttributeType: S
      KeySchema:
        - AttributeName: policy_key
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
Outputs:
  TableName:
    Value: !Ref BackendPolicyTable
  TableArn:
    Value: !GetAtt BackendPolicyTable.Arn
